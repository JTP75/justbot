[package]
name = "rustbot"
version = "0.1.0"
edition = "2024"

[dependencies]
anthropic = "0.0.8"
chrono = { version = "0.4.42", features = ["serde"] }
ctor = "0.6.0"
directories = "6.0.0"
dotenvy = "0.15.7"
log = "0.4.28"
once_cell = "1.21.3"
qdrant-client = { version = "1.15.0", features = ["serde"] }
rand = "0.9.2"
reqwest = "0.12.24"
rustyline = "17.0.2"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.18.1", features = ["v4"] }
