[package]
name = "puetce"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.7"
chrono = { version = "0.4.42", features = ["serde"] }
ctor = "0.6.0"
derive_builder = "0.20.2"
directories = "6.0.0"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.28"
once_cell = "1.21.3"
qdrant-client = { version = "1.15.0", features = ["serde"] }
rand = "0.9.2"
reqwest = { version = "0.12.24", features = ["json"] }
rustyline = "17.0.2"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
tower = "0.5.2"
yup-oauth2 = "12.1.0"

[[bin]]
name = "setup"
path = "bin/setup.rs"

[[bin]]
name = "puetce-server"
path = "src/backend.rs"

[[bin]]
name = "puetce-client"
path = "src/frontend.rs"