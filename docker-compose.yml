# docker-compose.yml

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ~/qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    # Optional: configure memory limits
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
